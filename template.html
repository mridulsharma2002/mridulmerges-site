<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}} · {{handle}}</title>
<meta name="description" content="{{tagline}} {{bio}}">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta property="og:type" content="profile">
<meta property="og:title" content="{{name}} · {{handle}}">
<meta property="og:description" content="{{tagline}} Software architecture, pseudocode and AI, explained in under a minute.">
<meta property="og:image" content="{{url}}/img/og.png">
<meta property="og:url" content="{{url}}/">
<link rel="canonical" href="{{url}}/">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/archivo-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Archivo;font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

:root{
  --bg:#0e0f11; --surface:#16181b; --surface-2:#1c1f23; --line:#26292e; --line-2:#363a41;
  --ink:#f2f3f5; --ink-2:#b9bec5; --ink-3:#949aa3; --accent:#a99cf5; --accent-ink:#0e0f11; --live:#7fd1a4;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f8f9fa; --line:#e3e5e8; --line-2:#cfd3d8;
    --ink:#121417; --ink-2:#4a5058; --ink-3:#5c626b; --accent:#5b48d6; --accent-ink:#ffffff; --live:#17764a;
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px -14px rgba(16,18,22,.18);
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60rem 28rem at 50% -12rem,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.wrap{max-width:560px;margin:0 auto;padding:56px 16px calc(40px + env(safe-area-inset-bottom))}

header{text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 20px;
  box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--line-2)}
h1{font:800 32px/1.1 Archivo,system-ui,sans-serif;letter-spacing:-.02em}
.handle{font:500 14px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--ink-3);margin-top:10px}
.tagline{font:800 20px/1.2 Archivo,system-ui,sans-serif;letter-spacing:-.01em;margin-top:18px;color:var(--accent)}
.bio{color:var(--ink-2);margin:8px auto 0;max-width:400px;font-size:16px;text-wrap:balance}
.note{color:var(--ink-3);font-size:13.5px;margin-top:12px;padding-left:4px}

section{margin-top:36px}
.eyebrow{font:500 11.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:12px;margin-bottom:14px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:10px}

.row,.card{position:relative;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  transition:transform .18s ease,border-color .18s ease,background-color .18s ease}
.row{align-items:center;gap:14px;padding:12px 16px 12px 12px;min-height:64px}
a.row:hover,a.card:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateY(-1px)}
a.row:active,a.card:active{transform:translateY(0)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.ico{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.ico svg{width:20px;height:20px;fill:var(--ink)}
.txt{display:flex;flex-direction:column;min-width:0;flex:1}
.txt b{font-weight:600;font-size:16px;line-height:1.25}
.txt span{color:var(--ink-3);font-size:13.5px;line-height:1.35;margin-top:2px}
.go{flex:none;width:18px;height:18px;color:var(--ink-3);transition:color .18s ease,transform .18s ease}
a:hover .go{color:var(--ink);transform:translate(1px,-1px)}

.card{flex-direction:column;padding:16px 44px 16px 16px;gap:4px}
.card .go{position:absolute;top:18px;right:16px}
.card .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .top b{font:800 19px/1.2 Archivo,system-ui,sans-serif;letter-spacing:-.01em}
.card .desc{color:var(--ink-2);font-size:14.5px;margin-top:6px}
.pill{font:500 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3)}
.pill.live{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent);display:inline-flex;align-items:center;gap:6px}
.pill.now{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}

footer{margin-top:48px;text-align:center;color:var(--ink-3);font-size:13px}
footer q{display:block;font:500 11.5px/1.5 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-style:normal;quotes:none;margin-bottom:10px}

@media (max-width:380px){
  .wrap{padding-top:40px}
  h1{font-size:28px}
  .tagline{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <img class="avatar" src="/img/mridul.jpg" srcset="/img/mridul.jpg 320w, /img/mridul-600.jpg 600w" sizes="112px" width="112" height="112" alt="{{name}}">
    <h1>{{name}}</h1>
    <p class="handle">{{handle}}</p>
    <p class="tagline">{{tagline}}</p>
    <p class="bio">{{bio}}</p>
  </header>

  <section aria-labelledby="s-follow">
    <h2 class="eyebrow" id="s-follow">Follow along</h2>
    <ul class="list">{{social}}
    </ul>
  </section>

  <section aria-labelledby="s-build">
    <h2 class="eyebrow" id="s-build">Building</h2>
    <ul class="list">{{building}}
    </ul>
    <p class="note">{{note}}</p>
  </section>

  <footer>
    <q>{{signoff}}</q>
    <p>© {{year}} {{name}}</p>
  </footer>
</main>
</body>
</html>
