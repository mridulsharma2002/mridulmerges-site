<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mridul Sharma: tech, explained simply</title>
<meta name="description" content="Mridul Sharma is a software engineer in Fredericton and the founder of Gusset. He explains software architecture, pseudocode and AI in short daily videos.">

<meta property="og:description" content="Software engineer and founder of Gusset. Software architecture, pseudocode and AI, explained in under a minute.">
<meta property="og:url" content="{{url}}/">
<meta property="og:image" content="{{url}}/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mridul Sharma, @mridulmerges. Tech, explained simply.">

<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"Mridul Sharma","alternateName":"mridulmerges","url":"{{url}}/","image":"{{url}}/img/mridul-480.jpg",
"address":{"@type":"PostalAddress","addressLocality":"Fredericton","addressRegion":"NB","addressCountry":"CA"},
"alumniOf":[{"@type":"CollegeOrUniversity","name":"University of New Brunswick"},{"@type":"CollegeOrUniversity","name":"The University of Texas at Austin"}],
"knowsAbout":["Software architecture","Pseudocode","Artificial intelligence","Software engineering"],
"sameAs":["https://www.tiktok.com/@mridulmerges","https://www.instagram.com/mridulmerges/","https://www.youtube.com/@mridulmerges","https://www.linkedin.com/in/mridulmerges","https://gussetlog.ca","https://github.com/mridulsharma2002"]}
</script>
<style>
@font-face{font-family:Inter;font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-wght-normal.woff2) format("woff2")}
:root{
  --bg:#fafaf9;--surface:#ffffff;--hover:#f4f4f2;--ink:#0a0a0a;--ink-2:#52525b;--ink-3:#8a8a92;
  --line:#e7e6e3;--sig:#e8501a;--ease:cubic-bezier(.22,1,.36,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0b0c;--surface:#111113;--hover:#18181b;--ink:#ededed;--ink-2:#a1a1aa;--ink-3:#71717a;--line:#232326;--sig:#f0662f;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--ink);color:var(--bg)}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img,svg{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
main{max-width:540px;margin:0 auto;padding:clamp(40px,10vh,88px) 20px 48px}

/* header */
.me{display:flex;align-items:center;gap:14px}
.me img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--hover);box-shadow:0 0 0 1px var(--line)}
h1{font-size:17px;font-weight:600;letter-spacing:-.011em;line-height:1.3}
.role{color:var(--ink-3);font-size:14.5px;line-height:1.3;margin-top:2px}
.bio{margin-top:22px;color:var(--ink-2);font-size:15.5px;line-height:1.65;letter-spacing:-.003em}
.bio strong{color:var(--ink);font-weight:500}
.now{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--sig)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sig);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.6);opacity:0}}

/* sections */
h2{margin:40px 0 10px;font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.group li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:20px 1fr auto 16px;align-items:center;gap:14px;min-height:58px;padding:10px 16px;transition:background .2s var(--ease)}
.row .ic{width:19px;height:19px;color:var(--ink)}
.row .ic svg{width:100%;height:100%;fill:currentColor}
.row b{font-weight:500;font-size:15px;letter-spacing:-.006em}
.row .sub{color:var(--ink-3);font-size:13.5px;text-align:right}
.row .arr{width:14px;height:14px;color:var(--ink-3);transition:transform .25s var(--ease),color .2s var(--ease)}
@media (hover:hover){.row:hover{background:var(--hover)}.row:hover .arr{transform:translate(2px,-2px);color:var(--ink)}}
.row:active{background:var(--hover)}
@media (max-width:420px){.row{grid-template-columns:20px 1fr 16px}.row .sub{display:none}}

.proj{display:grid;grid-template-columns:36px 1fr 16px;gap:14px;align-items:start;padding:16px;transition:background .2s var(--ease)}
.proj .mark{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden}
.proj .mark svg{width:26px;height:26px}
.proj b{font-weight:500;font-size:15px}
.proj .pill{margin-left:8px;font-size:12px;color:var(--ink-3)}
.proj p{color:var(--ink-2);font-size:14px;line-height:1.55;margin-top:2px}
.proj .arr{margin-top:4px;width:14px;height:14px;color:var(--ink-3);transition:transform .25s var(--ease),color .2s var(--ease)}
@media (hover:hover){.proj:hover{background:var(--hover)}.proj:hover .arr{transform:translate(2px,-2px);color:var(--ink)}}
.sw .route{fill:none;stroke:var(--ink-3);stroke-width:2}
.sw .node{fill:var(--bg);stroke:var(--ink);stroke-width:2.2}
.sw .hot{fill:var(--sig);stroke:var(--sig)}

footer{margin-top:44px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}

/* entrance: soft blur-in, staggered */
.in{opacity:0;filter:blur(4px);transform:translateY(6px);animation:in .7s var(--ease) forwards;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes in{to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;filter:none;transform:none}.dot::after{animation:none}.row,.proj,.arr{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="me in" style="--i:0">
      <picture><source type="image/webp" srcset="/img/mridul-240.webp 1x, /img/mridul-480.webp 2x"><img src="/img/mridul-480.jpg" width="56" height="56" alt="Mridul Sharma" fetchpriority="high"></picture>
      <div><h1>Mridul Sharma</h1><p class="role">Software engineer · Founder of Gusset</p></div>
    </div>
    <p class="bio in" style="--i:1"><strong>{{tagline}}</strong> {{bio}}</p>
    <p class="now in" style="--i:2"><span class="dot" aria-hidden="true"></span>New episode every day · @mridulmerges</p>
  </header>

  <section aria-labelledby="f-h">
    <h2 id="f-h" class="in" style="--i:3">Follow along</h2>
    <ul class="group in" style="--i:3">{{social}}
    </ul>
  </section>

  <section aria-labelledby="b-h">
    <h2 id="b-h" class="in" style="--i:5">Building</h2>
    <ul class="group in" style="--i:5">{{projects}}
    </ul>
  </section>

  <footer class="in" style="--i:7">
    <span>{{signoff}}</span>
    <span>© {{year}} Mridul Sharma</span>
  </footer>
</main>
</body>
</html>
