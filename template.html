<style>
@font-face{font-family:Archivo;font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{
  --paper:#f3f0e8;--card:#fbfaf6;--ink:#141414;--ink-2:#45423c;--ink-3:#5f5b53;
  --line:rgba(20,20,20,.12);--line-2:rgba(20,20,20,.9);--sig:#e8501a;--sig-ink:#b8400f;
  --shadow:0 1px 0 rgba(20,20,20,.04),0 8px 24px -12px rgba(20,20,20,.18);
  --display:Archivo,"Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#121110;--card:#1b1a18;--ink:#f1ede4;--ink-2:#cfc9bc;--ink-3:#a29b8e;
  --line:rgba(241,237,228,.12);--line-2:rgba(241,237,228,.85);--sig:#f0662f;--sig-ink:#f4844f;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60rem 28rem at 50% -8rem,color-mix(in srgb,var(--sig) 9%,transparent),transparent 70%)}
::selection{background:var(--sig);color:#fff}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img,svg{display:block}
:focus-visible{outline:2px solid var(--sig);outline-offset:3px;border-radius:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:56px 16px 40px}

/* profile */
.me{text-align:center}
.photo{width:112px;height:112px;margin:0 auto 18px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,var(--sig),color-mix(in srgb,var(--sig) 30%,transparent),var(--sig))}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--paper);background:var(--card)}
h1{font:800 clamp(30px,8vw,38px)/1.05 var(--display);letter-spacing:-.025em}
.handle{margin-top:6px;font:500 13px/1 var(--mono);color:var(--ink-3)}
.tag{margin-top:16px;font:600 17px/1.3 "IBM Plex Sans",sans-serif;color:var(--ink)}
.tag em{font-style:normal;color:var(--sig-ink)}
.bio{margin:8px auto 0;max-width:30em;color:var(--ink-2);font-size:15.5px}

/* links */
.links{display:grid;gap:10px;margin-top:30px}
.link{position:relative;display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:14px;min-height:64px;padding:10px 16px 10px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  transition:transform .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease)}
.link .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--paper);transition:background .25s var(--ease)}
.link .ic svg{width:21px;height:21px;fill:currentColor}
.link b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.link small{display:block;color:var(--ink-3);font-size:13.5px;line-height:1.3;margin-top:2px}
.link .arr{width:18px;height:18px;color:var(--ink-3);transition:transform .25s var(--ease),color .25s var(--ease)}
@media (hover:hover){
  .link:hover{transform:translateY(-2px);border-color:var(--line-2)}
  .link:hover .ic{background:var(--sig)}
  .link:hover .arr{transform:translateX(3px);color:var(--ink)}
}
.link:active{transform:scale(.985)}

/* projects */
h2{display:flex;align-items:center;gap:12px;margin:44px 0 14px;font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.projects{display:grid;gap:12px}
.proj{position:relative;display:block;overflow:hidden;padding:18px 18px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  transition:transform .25s var(--ease),border-color .25s var(--ease)}
.proj .top{display:flex;align-items:center;gap:10px}
.proj b{font:800 21px/1 var(--display);letter-spacing:-.015em}
.proj .pill{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:5px 8px}
.proj p{margin-top:8px;color:var(--ink-2);font-size:15px;max-width:34em;padding-right:64px}
.proj .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:14px;color:var(--sig-ink)}
.proj .go svg{width:15px;height:15px;transition:transform .25s var(--ease)}
.proj .art{position:absolute;right:14px;bottom:12px;width:64px;height:64px;transition:transform .45s var(--ease)}
.proj .art svg{width:100%;height:100%}
@media (hover:hover){
  .proj:hover{transform:translateY(-2px);border-color:var(--line-2)}
  .proj:hover .go svg{transform:translateX(3px)}
  .proj:hover .art{transform:translateY(-4px) rotate(-6deg)}
}
/* Switchboard glyph: a packet hops along the active route */
.sw .route{fill:none;stroke:var(--line-2);stroke-width:1.6;opacity:.35}
.sw .node{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.sw .pkt{fill:var(--sig);offset-path:path("M8 32 C 24 32, 30 12, 54 12");animation:hop 2.6s var(--ease) infinite}
@keyframes hop{0%{offset-distance:0%;opacity:0}12%{opacity:1}75%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}

footer{margin-top:44px;text-align:center;color:var(--ink-3);font-size:13.5px}
footer p+p{margin-top:4px;font:500 11.5px/1.4 var(--mono);letter-spacing:.06em}

/* entrance */
.in{opacity:0;transform:translateY(10px);animation:rise .6s var(--ease) forwards;animation-delay:calc(var(--i,0) * 55ms + 60ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .in{animation:none;opacity:1;transform:none}
  .sw .pkt{animation:none;offset-distance:100%}
  .link,.proj,.art,.arr{transition:none}
}
</style>
</head>
<body>
<main>
  <header class="me">
    <div class="photo in" style="--i:0"><picture><source type="image/webp" srcset="/img/mridul-240.webp 1x, /img/mridul-480.webp 2x"><img src="/img/mridul-480.jpg" width="112" height="112" alt="Mridul Sharma" fetchpriority="high"></picture></div>
    <h1 class="in" style="--i:1">Mridul Sharma</h1>
    <p class="handle in" style="--i:1">@mridulmerges</p>
    <p class="tag in" style="--i:2">{{tagline_html}}</p>
    <p class="bio in" style="--i:2">{{bio}}</p>
  </header>

  <nav aria-label="Follow Mridul">
    <ul class="links">{{social}}
    </ul>
  </nav>

  <section aria-labelledby="b-h">
    <h2 id="b-h" class="in" style="--i:9">What I'm building</h2>
    <div class="projects">{{projects}}
    </div>
  </section>

  <footer class="in" style="--i:12">
    <p>{{signoff}}</p>
    <p>© {{year}} Mridul Sharma · Fredericton, Canada</p>
  </footer>
</main>
</body>
</html>
